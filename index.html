<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VHuman — nền tảng Talent Intelligence kết hợp CV, kỹ năng và hồ sơ cá nhân để gợi ý hướng nghề nghiệp phù hợp và giúp doanh nghiệp tìm ứng viên phù hợp hơn." />
    <meta name="theme-color" content="#FFFBF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />

    <title>VHuman — Hiểu con người. Tìm đúng hướng đi.</title>

    <script>
      // Apply the stored/system theme before first paint so the page never
      // flashes the wrong palette. Kept inline and tiny on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('vhuman:v1:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
